<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>JARVIS</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src http://127.0.0.1:*; media-src 'self' blob:; worker-src 'self' blob:; font-src 'self'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="styles.css"><script defer src="app.js"></script></head>
<body data-state="idle" data-listening="true">
<header><div class="wordmark">J<span>A</span>RVIS<span class="edition"> / 01</span></div><div class="header-end"><span class="local-mark">YEREL SES</span><button type="button" class="quiet" id="settings-open" aria-label="Ayarlar">Ayarlar</button></div></header>
<main><section class="presence-area" aria-label="JARVIS"><div class="coordinate">PERSONAL INTELLIGENCE SYSTEM</div><canvas data-presence aria-label="JARVIS ses durumu"></canvas><div class="status"><i></i><span data-status>Hazır</span></div><p data-caption role="status" aria-live="polite" hidden></p></section><section data-stage aria-label="JARVIS kartları" aria-live="polite"></section></main>
<p class="error-notice" role="alert" hidden></p>
<footer><span class="connection-label">BU BİLGİSAYARDA</span><button type="button" id="listen-toggle" aria-pressed="true">Dinlemeyi durdur</button><span class="shortcut"><kbd>Ctrl</kbd> + <kbd>Alt</kbd> + <kbd>J</kbd></span></footer>
<dialog aria-label="Ayarlar"><form method="dialog"><div class="dialog-heading"><h1>Ayarlar</h1><button type="submit" aria-label="Kapat">Kapat</button></div></form><p>Sesiniz bu bilgisayarda kalır. Ses kaydı saklanmaz.</p><label for="microphone">Mikrofon</label><select id="microphone"><option value="">Varsayılan mikrofon</option></select><div class="setting-section"><h2>Sesiniz</h2><p data-enrollment-note>Arka plandaki konuşmaları ayırt etmek için sesinizi tanıtın.</p><button type="button" id="enroll-start">Sesimi tanı</button><button type="button" id="enroll-finish" hidden>Kaydı tamamla</button><button type="button" id="enroll-remove" class="quiet">Ses izini sil</button><div data-enrollment hidden><p data-enrollment-phrase></p><progress max="30" value="0" aria-label="Ses tanıma ilerlemesi"></progress></div></div><div class="setting-section"><h2>Konuşmalar</h2><button type="button" id="turns-export">Dışa aktar</button><button type="button" id="turns-delete" class="quiet">Tümünü sil</button><p data-confirm-delete hidden>Konuşmalar kalıcı olarak silinecek. <button type="button" id="turns-confirm">Evet, sil</button></p></div><p data-settings-status role="status"></p></dialog>
</body></html>
