<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>JARVIS Overlay</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="overlay.js"></script>
  </head>
  <body class="overlay" data-state="idle">
    <button type="button" class="presence" data-restore aria-label="JARVIS penceresini aç" title="JARVIS penceresini aç">
      <canvas data-presence aria-hidden="true"></canvas>
    </button>
    <p class="bubble" data-caption hidden></p>
    <section class="stage" data-stage aria-label="Kartlar"></section>
  </body>
</html>
