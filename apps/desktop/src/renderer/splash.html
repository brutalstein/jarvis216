<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>J.A.R.V.I.S</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="splash.js"></script>
  </head>
  <body class="splash" data-state="thinking" data-phase="running">
    <button type="button" class="boot-close" data-quit aria-label="Kapat" title="Kapat"><span data-icon="close"></span></button>
    <main class="boot">
      <div class="boot-orb"><canvas data-presence aria-hidden="true"></canvas></div>
      <h1 class="wordmark boot-mark">J.A.R.V.I.S</h1>
      <p class="boot-line" data-line role="status">Sistemler hazırlanıyor</p>
      <div class="boot-progress" data-progress role="progressbar" aria-label="Hazırlık" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span data-bar></span>
      </div>
      <ol class="boot-steps" data-steps aria-label="Kontroller"></ol>
      <p class="boot-error" data-error role="alert" hidden></p>
      <div class="boot-actions" data-actions hidden>
        <button type="button" class="boot-button primary" data-retry>Tekrar dene</button>
        <button type="button" class="boot-button" data-quit>Kapat</button>
      </div>
    </main>
  </body>
</html>
