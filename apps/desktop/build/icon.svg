<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="plate" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#292524"/>
      <stop offset="0.55" stop-color="#151311"/>
      <stop offset="1" stop-color="#0a0908"/>
    </radialGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a7e5d3"/>
      <stop offset="0.35" stop-color="#a8c8e8"/>
      <stop offset="0.7" stop-color="#c8b8e0"/>
      <stop offset="1" stop-color="#f4c5a8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a7e5d3" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#a8c8e8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#a8c8e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#d9f5ec"/>
      <stop offset="1" stop-color="#a7e5d3"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <!-- Plate: the app's warm-stone surface with a hairline edge. -->
  <rect x="48" y="48" width="928" height="928" rx="208" fill="url(#plate)"/>
  <rect x="49.5" y="49.5" width="925" height="925" rx="206.5" fill="none" stroke="#44403c" stroke-width="3"/>
  <circle cx="512" cy="512" r="330" fill="url(#glow)"/>
  <g fill="none" stroke="url(#spectrum)" stroke-linecap="round">
    <!-- Outer HUD ring: twelve segments, a gap at each hour. -->
    <circle cx="512" cy="512" r="352" stroke-width="10" stroke-dasharray="160.3 24" opacity="0.9" transform="rotate(-82 512 512)"/>
    <circle cx="512" cy="512" r="318" stroke-width="3" opacity="0.45"/>
    <!-- The presence rings, tightening toward the core. -->
    <circle cx="512" cy="512" r="276" stroke-width="12" opacity="0.95"/>
    <circle cx="512" cy="512" r="232" stroke-width="5" opacity="0.6" stroke-dasharray="6 18"/>
    <circle cx="512" cy="512" r="196" stroke-width="16"/>
    <circle cx="512" cy="512" r="150" stroke-width="6" opacity="0.7"/>
    <circle cx="512" cy="512" r="112" stroke-width="20"/>
  </g>
  <circle cx="512" cy="512" r="74" fill="#a7e5d3" opacity="0.6" filter="url(#soft)"/>
  <circle cx="512" cy="512" r="58" fill="url(#core)"/>
</svg>
