[project]
name = "jarvis-browser-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["browser-use==0.13.11"]

[dependency-groups]
dev = ["mypy==2.4.0", "ruff==0.17.1"]

[tool.mypy]
python_version = "3.12"
strict = true
follow_imports = "skip"
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
